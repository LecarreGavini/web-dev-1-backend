<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="p-8 space-y-4">
	<div class="flex gap-4 items-bottom">
		<button id='get' class="p-3 bg-gray-400 rounded-xl">GET</button>
		<div class="flex flex-col">
			<label>Identity:</label>
			<input id="identity" type='number' class="bg-gray-400 rounded-xl p-4 h-6">
		</div>
		<button id='post' class="p-3 bg-gray-400 rounded-xl">POST</button>
		<button id='get2' class="p-3 bg-gray-400 rounded-xl">EXPOSE DPWH</button>
	</div>
	<div class="space-x-4">
		<span id="success" class="text-xl text-green-500"></span>
		<span id="error" class="text-xl text-red-500"></span>
		<span id="message" class="italic"></span>
	</div>
	<div class="space-x-4">
		<button class="tab p-3 bg-blue-200 rounded-xl">Apple</button>
		<button class="tab p-3 bg-blue-200 rounded-xl">Orange</button>
		<button class="tab p-3 bg-blue-200 rounded-xl">Banana</button>
	</div>
	<div>
		<div id="title" class="text-2xl font-bold"></div>
		<div id="description" class="text-sm"></div>
	</div>
	<div class="space-y-4">
		<table id='users' class="border-2 border">
			<tr class="header bg-gray-200">
				<th class="py-2 px-6">First Name</th>
				<th class="py-2 px-6">Last Name</th>
				<th class="py-2 px-6">Age</th>
			</tr>
		</table>
		<div class="space-x-4">
			<button id='previous' class="h-10 w-20 rounded-lg bg-gray-200">Previous</button>
			<button id='next' class="h-10 w-20 rounded-lg bg-gray-200">Next</button>
		</div>
	</div>
	<div>
		<div class="flex items-center gap-2">
			<div>ID:</div>
			<input id="id-number" class="bg-gray-200 rounded-md p-2">
			<button id="search-id" class="bg-blue-100 rounded-md p-2">Search</button>
		</div>
		<div id="search-error" class="text-red-500 mt-2 hidden">
			Something went wrong
		</div>
		<div>
			<div id="id"></div>
			<div id="first"></div>
			<div id="last"></div>
			<div id="age"></div>
		</div>
	</div>
	<script src="js/1.js"></script>
	<script src="js/2.js"></script>
	<div>
		<button class="tab p-2 bg-gray-200">HTML</button>
		<button class="tab p-2 bg-gray-200">CSS</button>
		<button class="tab p-2 bg-gray-200">JS</button>
		<button class="tab p-2 bg-gray-200">BE</button>
	</div>
	<div>
		<div id="title" class="text-2xl"></div>
		<div id="label" class="italic"></div>
		<div id="description" class="text-xs"></div>
		<ul id="topics" class="list-inside list-disc text-sm">
		</ul>
	</div>
	<script src="js/3.js"></script>
</body>

</html>
