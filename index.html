<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="p-8">
	<div class="flex gap-4 items-center">
		<button id='get' class="p-8 bg-gray-600 rounded-xl">GET</button>
		<div class="flex flex-col gap-2">
			<label>Identity:</label>
			<input id="identity" class="bg-gray-600 rounded-xl p-4 h-6">
		</div>
		<button id='post' class="p-8 bg-gray-600 rounded-xl">POST</button>
		<button id='get2' class="p-8 bg-gray-600 rounded-xl">EXPOSE DPWH</button>
	</div>
	<div class="mt-4 space-x-4">
		<span id="success" class="text-xl text-green-500"></span>
		<span id="error" class="text-xl text-red-500"></span>
		<span id="message" class="italic"></span>
	</div>
	<script>
		document.getElementById('get').addEventListener('click', () => {
			get()
			// Old()
		})

		const get = async () => {
			const response = await fetch('http://localhost:3000/')
			const text = await response.text()
			console.log(text);
		}

		const getOld = () => {
			fetch('http://localhost:3000/').then((response) => {
				return response.text()
			}).then((text) => {
				console.log(text);
			})
		}

		document.getElementById('post').addEventListener('click', async () => {
			const value = document.getElementById('identity').value
			const data = await post(value)
			if (data.success) {
				document.getElementById('error').innerText = ''
				document.getElementById('success').innerText = 'Success'
			}
			else {
				document.getElementById('success').innerText = ''
				document.getElementById('error').innerText = 'Failed'
			}
			document.getElementById('message').innerText = data.message
		})

		const post = async (identity) => {
			const response = await fetch('http://localhost:3000/', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify({
					id: identity,
				})
			})
			const data = await response.json()
			return data
		}

		document.getElementById('get2').addEventListener('click', async () => {
			const response = await fetch('http://127.0.0.1:3000/department-public-work-highways')
			const data = await response.json()
			document.getElementById('message').innerText = `${data.who} plundered ${data.plundered}`
		})
	</script>
</body>

</html>
